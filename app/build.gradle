apply plugin: 'com.android.application'

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId "xyz.moonchan.camera"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProps['storeFile'] ?: 'release.keystore')
            storePassword keystoreProps['storePassword'] ?: 'android123'
            keyAlias keystoreProps['keyAlias'] ?: 'release'
            keyPassword keystoreProps['keyPassword'] ?: 'android123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }
}

    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        implementation 'androidx.appcompat:appcompat:1.0.2'
        implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
        implementation 'com.google.android.material:material:1.0.0'
        implementation 'org.nanohttpd:nanohttpd:2.3.1'
        implementation "androidx.camera:camera-core:1.0.0-beta06"
        implementation "androidx.camera:camera-camera2:1.0.0-beta06"
        implementation "androidx.camera:camera-lifecycle:1.0.0-beta06"
        implementation 'androidx.lifecycle:lifecycle-service:2.0.0'
        testImplementation 'junit:junit:4.12'
        androidTestImplementation 'androidx.test.ext:junit:1.1.0'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    }
