name: Build APK

on:
  push:
    branches: [ proj/android-gh-action ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Android SDK
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV

          # Find sdkmanager
          SDKMANAGER=$(find ${ANDROID_SDK_ROOT} -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager found, installing cmdline-tools..."
            mkdir -p /tmp/android-setup
            cd /tmp/android-setup
            curl -sL -o cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mkdir -p ${ANDROID_SDK_ROOT}/cmdline-tools
            mv cmdline-tools ${ANDROID_SDK_ROOT}/cmdline-tools/latest
            SDKMANAGER=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager
          fi

          echo "SDKMANAGER=${SDKMANAGER}" >> $GITHUB_ENV

      - name: Accept licenses & install platform
        run: |
          yes | ${{ env.SDKMANAGER }} --licenses > /dev/null 2>&1 || true
          ${{ env.SDKMANAGER }} "platforms;android-29" "build-tools;30.0.3" > /dev/null 2>&1 || true

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK and post to Board 666
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          NAME=$(basename "$APK")
          echo "Found APK: $APK"

          URLNAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$NAME'))")
          RESP=$(curl -s -X PUT \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-File-Name: ${URLNAME}" \
            --data-binary "@${APK}" \
            https://upload.moonchan.xyz/api/upload)
          FID=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id') or (d.get('data') or {}).get('id',''))")
          DLURL="https://upload.moonchan.xyz/api/${FID}/${URLNAME}"
          echo "Uploaded: ${DLURL}"

          COOKIE=$(curl -s -c - "https://vps.moonchan.xyz/api/v2/cookie" 2>/dev/null | awk '/auth/{print $NF}')
          TS=$(date -u '+%Y-%m-%d %H:%M:%S')
          TXT="Download: ${DLURL}\n\n${TS}"
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: auth=${COOKIE}" \
            -d "$(python3 -c "import json; print(json.dumps({'id':'','no':0,'n':'GitHub Actions','t':'APK: ${NAME}','txt':'${TXT}','p':''}))")" \
            "https://vps.moonchan.xyz/api/v2/?bid=666&tid=0"
          echo "Posted to Board 666"
